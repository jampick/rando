<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<script>
function draw(canvas) {
  const s = canvas.width;
  const ctx = canvas.getContext('2d');
  // Background
  ctx.fillStyle = '#1a1a2e';
  ctx.beginPath();
  ctx.roundRect(0, 0, s, s, s * 0.2);
  ctx.fill();
  // Dice dot pattern
  ctx.fillStyle = '#e94560';
  const r = s * 0.06;
  const positions = [[0.5, 0.5], [0.3, 0.3], [0.7, 0.7], [0.3, 0.7], [0.7, 0.3]];
  positions.forEach(([x, y]) => {
    ctx.beginPath();
    ctx.arc(s * x, s * y, r, 0, Math.PI * 2);
    ctx.fill();
  });
  // Question mark overlay
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${s * 0.45}px Inter, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('?', s * 0.5, s * 0.52);
}
draw(document.getElementById('c192'));
draw(document.getElementById('c512'));
// To save: right-click canvases and save as icon-192.png / icon-512.png
</script>
</body>
</html>
